---
# Codacy Cloud analysis scope, read from the default branch.
# Tools and patterns come from the org coding standards; this file only narrows which paths are analysed.
# Root-level files need their own entry: "**/" does not match the repository root.
exclude_paths:
  # Tests stay private and untracked; listed so a stray commit does not trip fs/regex security rules.
  - "**/*.test.ts"
  # Generated lockfile (Lizard file-length noise).
  - "package-lock.json"
  # Keep a Changelog repeats Added/Changed/Fixed headings by design (markdownlint MD024).
  - "CHANGELOG.md"
