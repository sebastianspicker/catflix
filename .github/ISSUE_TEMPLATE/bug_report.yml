---
name: Bug report
description: Report a reproducible Catflix problem without including private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Check the [known issues](https://github.com/sebastianspicker/catflix/blob/main/docs/KNOWN_ISSUES.md)
        first. Don't include exported records, household names, or
        security-sensitive details. Use private vulnerability reporting for
        security issues.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Shown at the bottom of the catalogue page, for example "Version 0.2.0 · build 1a2b3c4".
      placeholder: 0.2.0 · build 1a2b3c4
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Catalogue
        - Safety gate
        - Tablet scene
        - Television scene
        - Local records or data transfer
        - Research view
        - Screenshot tour
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 142 on macOS, desktop viewport
    validations:
      required: true
